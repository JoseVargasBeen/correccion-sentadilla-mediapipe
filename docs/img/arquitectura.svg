<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Bahnschrift, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Arquitectura: Camcel transmite la cámara del celular y la app de PC analiza la pose</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8FA39B"/>
    </marker>
    <marker id="flecha-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3FA672"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#1B2623"/>

  <!-- Celular -->
  <rect x="24" y="24" width="270" height="422" fill="#22302C" stroke="#35443F"/>
  <text x="44" y="58" fill="#E6EBE6" font-size="19" font-weight="bold">Celular · Camcel</text>
  <text x="44" y="80" fill="#8FA39B" font-size="13">Flutter · Dart · Kotlin</text>

  <rect x="44" y="102" width="230" height="58" fill="#1B2623" stroke="#35443F"/>
  <text x="58" y="127" fill="#E6EBE6" font-size="14.5">Cámara (NV21)</text>
  <text x="58" y="147" fill="#8FA39B" font-size="12">240p / 480p / 720p</text>

  <rect x="44" y="184" width="230" height="58" fill="#1B2623" stroke="#35443F"/>
  <text x="58" y="209" fill="#E6EBE6" font-size="14.5">JPEG nativo (Kotlin)</text>
  <text x="58" y="229" fill="#8FA39B" font-size="12">YuvImage.compressToJpeg</text>

  <rect x="44" y="266" width="230" height="58" fill="#1B2623" stroke="#3FA672"/>
  <text x="58" y="291" fill="#E6EBE6" font-size="14.5">Servidor MJPEG  /video</text>
  <text x="58" y="311" fill="#8FA39B" font-size="12">salta fotogramas, no los encola</text>

  <rect x="44" y="348" width="230" height="78" fill="#1B2623" stroke="#35443F"/>
  <text x="58" y="373" fill="#E6EBE6" font-size="14.5">Punto de acceso + QR</text>
  <text x="58" y="393" fill="#8FA39B" font-size="12">red propia cuando no hay WiFi</text>
  <text x="58" y="411" fill="#8FA39B" font-size="12">común (solo datos móviles)</text>

  <line x1="159" y1="160" x2="159" y2="182" stroke="#8FA39B" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="159" y1="242" x2="159" y2="264" stroke="#8FA39B" stroke-width="1.6" marker-end="url(#flecha)"/>

  <!-- Red -->
  <line x1="276" y1="295" x2="382" y2="295" stroke="#3FA672" stroke-width="2.2" marker-end="url(#flecha-verde)"/>
  <text x="300" y="282" fill="#3FA672" font-size="12.5">MJPEG</text>
  <text x="300" y="316" fill="#8FA39B" font-size="11.5">HTTP</text>
  <path d="M276 387 C 320 387, 330 387, 382 387" stroke="#8FA39B" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#flecha)"/>
  <text x="298" y="376" fill="#8FA39B" font-size="11.5">QR leído</text>
  <text x="298" y="406" fill="#8FA39B" font-size="11.5">por webcam</text>

  <!-- PC -->
  <rect x="364" y="24" width="572" height="422" fill="#22302C" stroke="#35443F"/>
  <text x="384" y="58" fill="#E6EBE6" font-size="19" font-weight="bold">PC · Proyecto-de-pose</text>
  <text x="384" y="80" fill="#8FA39B" font-size="13">Python · MediaPipe · OpenCV · CustomTkinter</text>

  <rect x="384" y="266" width="160" height="58" fill="#1B2623" stroke="#35443F"/>
  <text x="398" y="291" fill="#E6EBE6" font-size="14.5">LectorCamara</text>
  <text x="398" y="311" fill="#8FA39B" font-size="12">hilo, solo el último</text>

  <rect x="384" y="348" width="160" height="78" fill="#1B2623" stroke="#35443F"/>
  <text x="398" y="373" fill="#E6EBE6" font-size="14.5">conexion_qr</text>
  <text x="398" y="393" fill="#8FA39B" font-size="12">entra a la red</text>
  <text x="398" y="411" fill="#8FA39B" font-size="12">con netsh</text>

  <rect x="570" y="102" width="160" height="58" fill="#1B2623" stroke="#35443F"/>
  <text x="584" y="127" fill="#E6EBE6" font-size="14.5">MediaPipe Pose</text>
  <text x="584" y="147" fill="#8FA39B" font-size="12">33 puntos por frame</text>

  <rect x="570" y="184" width="160" height="58" fill="#1B2623" stroke="#35443F"/>
  <text x="584" y="209" fill="#E6EBE6" font-size="14.5">Filtro de coherencia</text>
  <text x="584" y="229" fill="#8FA39B" font-size="12">razones del perfil</text>

  <rect x="570" y="266" width="160" height="58" fill="#1B2623" stroke="#35443F"/>
  <text x="584" y="291" fill="#E6EBE6" font-size="14.5">Lado visible</text>
  <text x="584" y="311" fill="#8FA39B" font-size="12">ángulos y tronco</text>

  <rect x="756" y="184" width="160" height="58" fill="#1B2623" stroke="#35443F"/>
  <text x="770" y="209" fill="#E6EBE6" font-size="14.5">Máquina de estados</text>
  <text x="770" y="229" fill="#8FA39B" font-size="12">cuenta y juzga</text>

  <rect x="756" y="266" width="160" height="58" fill="#1B2623" stroke="#35443F"/>
  <text x="770" y="291" fill="#E6EBE6" font-size="14.5">Postura</text>
  <text x="770" y="311" fill="#8FA39B" font-size="12">inclinación, joroba</text>

  <rect x="756" y="348" width="160" height="78" fill="#1F7A50"/>
  <text x="770" y="378" fill="#FFFFFF" font-size="16" font-weight="bold">Panel</text>
  <text x="770" y="398" fill="#E6EBE6" font-size="12">veredicto que se lee</text>
  <text x="770" y="414" fill="#E6EBE6" font-size="12">a tres metros</text>

  <line x1="464" y1="266" x2="464" y2="131" stroke="#8FA39B" stroke-width="1.6"/>
  <line x1="464" y1="131" x2="568" y2="131" stroke="#8FA39B" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="650" y1="160" x2="650" y2="182" stroke="#8FA39B" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="650" y1="242" x2="650" y2="264" stroke="#8FA39B" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="730" y1="285" x2="742" y2="285" stroke="#8FA39B" stroke-width="1.6"/>
  <line x1="742" y1="213" x2="742" y2="295" stroke="#8FA39B" stroke-width="1.6"/>
  <line x1="742" y1="213" x2="754" y2="213" stroke="#8FA39B" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="742" y1="295" x2="754" y2="295" stroke="#8FA39B" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="836" y1="324" x2="836" y2="346" stroke="#8FA39B" stroke-width="1.6" marker-end="url(#flecha)"/>
  <path d="M916 213 C 936 213, 936 387, 918 387" stroke="#8FA39B" stroke-width="1.6" fill="none" marker-end="url(#flecha)"/>
</svg>
